---
# TODO: Fix idempotency issues with these rules
cis_security_hardening::rules::log_suspicious_packets::enforce: false  # Ubuntu 24.04 containers reset live value between runs
cis_security_hardening::rules::logrotate_configuration::enforce: false
cis_security_hardening::rules::mta_local::enforce: false

# Automatic reboot can interfere with verification TODO: how can this be enabled?
cis_security_hardening::auto_reboot: false

# Disable things that do not work properly in containers
cis_security_hardening::rules::apparmor_bootloader::enforce: false
cis_security_hardening::rules::authselect::enforce: false
cis_security_hardening::rules::chrony::enforce: false
cis_security_hardening::rules::enable_aslr::enforce: false
cis_security_hardening::rules::ptrace_scope::enforce: false
cis_security_hardening::rules::restrict_core_dumps::enforce: false
cis_security_hardening::rules::disable_ipv6::enforce: false
cis_security_hardening::rules::disable_wireless::enforce: false  # NetworkManager radio reports enabled in Debian 11 container
cis_security_hardening::rules::fips_bootloader::enforce: false
cis_security_hardening::rules::grub_bootloader_config::enforce: false
cis_security_hardening::rules::grub_page_poison::enforce: false
cis_security_hardening::rules::grub_password::enforce: false
cis_security_hardening::rules::grub_slub_debug::enforce: false
cis_security_hardening::rules::grub_vsyscall::enforce: false
cis_security_hardening::rules::passwd_inactive_days::enforce: false  # Password aging not persistent in containers
cis_security_hardening::rules::passwd_min_days::enforce: false  # Password aging not persistent in containers
cis_security_hardening::rules::pti::enforce: false
cis_security_hardening::rules::selinux_bootloader::enforce: false
cis_security_hardening::rules::tmp_filesystem::enforce: false

# iptables/nftables have some problems in containers TODO: what can we enable?
cis_security_hardening::rules::firewalld_default_zone::enforce: false
cis_security_hardening::rules::firewalld_install::enforce: false
