---
# TODO: Fix idempotency issues with these rules
cis_security_hardening::rules::log_suspicious_packets::enforce: false  # Ubuntu 24.04 containers reset live value between runs
cis_security_hardening::rules::logrotate_configuration::enforce: false
cis_security_hardening::rules::mta_local::enforce: false

# Automatic reboot can interfere with verification TODO: how can this be enabled?
cis_security_hardening::auto_reboot: false

