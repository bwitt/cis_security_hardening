---
# Rules below were each enabled, run, and disabled again with the observed reason.
# Failures on only some platforms live in family/<osfamily>/<release>.yaml.

# A reboot would end the run before the idempotency apply
cis_security_hardening::auto_reboot: false

# No grub-mkconfig in a container, so kernel_parameter has no usable provider
cis_security_hardening::rules::apparmor_bootloader::enforce: false
cis_security_hardening::rules::disable_ipv6::enforce: false
cis_security_hardening::rules::fips_bootloader::enforce: false
cis_security_hardening::rules::grub_bootloader_config::enforce: false
cis_security_hardening::rules::grub_page_poison::enforce: false
cis_security_hardening::rules::grub_slub_debug::enforce: false
cis_security_hardening::rules::grub_vsyscall::enforce: false
cis_security_hardening::rules::pti::enforce: false
cis_security_hardening::rules::selinux_bootloader::enforce: false

# Global kernel sysctls: a privileged container writes these to the CI runner's kernel
cis_security_hardening::rules::enable_aslr::enforce: false
cis_security_hardening::rules::ptrace_scope::enforce: false
cis_security_hardening::rules::restrict_core_dumps::enforce: false

# Left to PR #78, which enables these
cis_security_hardening::rules::dev_shm::enforce: false
cis_security_hardening::rules::dev_shm_nodev::enforce: false
cis_security_hardening::rules::dev_shm_noexec::enforce: false
cis_security_hardening::rules::dev_shm_nosuid::enforce: false

# Mutate live netfilter state; the deny-policy rules cut beaker's own SSH channel
cis_security_hardening::rules::iptables_deny_policy::enforce: false
cis_security_hardening::rules::iptables_install::enforce: false
cis_security_hardening::rules::iptables_loopback::enforce: false
cis_security_hardening::rules::iptables_open_ports::enforce: false
cis_security_hardening::rules::iptables_outbound_established::enforce: false
cis_security_hardening::rules::nftables_base_chains::enforce: false
cis_security_hardening::rules::nftables_default_deny::enforce: false
cis_security_hardening::rules::nftables_flush_iptables::enforce: false
cis_security_hardening::rules::nftables_install::enforce: false
cis_security_hardening::rules::nftables_loopback::enforce: false
cis_security_hardening::rules::nftables_outbound_established::enforce: false
cis_security_hardening::rules::nftables_persistence::enforce: false
cis_security_hardening::rules::nftables_service::enforce: false
cis_security_hardening::rules::nftables_table::enforce: false

# auditd_init's auditctl -R fails in a container and its -D would flush the host's
# rules; all fragment rules target its file, and auditd_service will not start
# auditd_immutable's -e 2 would lock the host audit subsystem until reboot
cis_security_hardening::rules::auditd_access::enforce: false
cis_security_hardening::rules::auditd_actions::enforce: false
cis_security_hardening::rules::auditd_apparmor_parser_use::enforce: false
cis_security_hardening::rules::auditd_backlog_limit::enforce: false
cis_security_hardening::rules::auditd_chacl_use::enforce: false
cis_security_hardening::rules::auditd_chage_use::enforce: false
cis_security_hardening::rules::auditd_chcon_use::enforce: false
cis_security_hardening::rules::auditd_chfn_use::enforce: false
cis_security_hardening::rules::auditd_chsh_use::enforce: false
cis_security_hardening::rules::auditd_crontab_use::enforce: false
cis_security_hardening::rules::auditd_delete::enforce: false
cis_security_hardening::rules::auditd_delete_module::enforce: false
cis_security_hardening::rules::auditd_failure_processing::enforce: false
cis_security_hardening::rules::auditd_fdisk_use::enforce: false
cis_security_hardening::rules::auditd_finit_module_use::enforce: false
cis_security_hardening::rules::auditd_fremovexattr_use::enforce: false
cis_security_hardening::rules::auditd_fsetxattr_use::enforce: false
cis_security_hardening::rules::auditd_gpasswd_use::enforce: false
cis_security_hardening::rules::auditd_identity::enforce: false
cis_security_hardening::rules::auditd_immutable::enforce: false
cis_security_hardening::rules::auditd_init::enforce: false
cis_security_hardening::rules::auditd_init_module::enforce: false
cis_security_hardening::rules::auditd_kernel_modules::enforce: false
cis_security_hardening::rules::auditd_kmod_use::enforce: false
cis_security_hardening::rules::auditd_logins::enforce: false
cis_security_hardening::rules::auditd_loginuid_immutable::enforce: false
cis_security_hardening::rules::auditd_lremovexattr_use::enforce: false
cis_security_hardening::rules::auditd_lsetxattr_use::enforce: false
cis_security_hardening::rules::auditd_mac_policy::enforce: false
cis_security_hardening::rules::auditd_modules::enforce: false
cis_security_hardening::rules::auditd_mounts::enforce: false
cis_security_hardening::rules::auditd_newgrp_use::enforce: false
cis_security_hardening::rules::auditd_nonlocal_admin_access::enforce: false
cis_security_hardening::rules::auditd_open_by_handle_use::enforce: false
cis_security_hardening::rules::auditd_overflow_action::enforce: false
cis_security_hardening::rules::auditd_pam_timestamp_check_use::enforce: false
cis_security_hardening::rules::auditd_passwd_use::enforce: false
cis_security_hardening::rules::auditd_perm_mod::enforce: false
cis_security_hardening::rules::auditd_postdrop::enforce: false
cis_security_hardening::rules::auditd_postqueue::enforce: false
cis_security_hardening::rules::auditd_privileged_commands::enforce: false
cis_security_hardening::rules::auditd_privileged_functions_use::enforce: false
cis_security_hardening::rules::auditd_privileged_priv_change::enforce: false
cis_security_hardening::rules::auditd_process::enforce: false
cis_security_hardening::rules::auditd_remote_conf::enforce: false
cis_security_hardening::rules::auditd_remote_labeled::enforce: false
cis_security_hardening::rules::auditd_removexattr_use::enforce: false
cis_security_hardening::rules::auditd_rmdir::enforce: false
cis_security_hardening::rules::auditd_rsyslog_gnutls::enforce: false
cis_security_hardening::rules::auditd_scope::enforce: false
cis_security_hardening::rules::auditd_semanage::enforce: false
cis_security_hardening::rules::auditd_service::enforce: false
cis_security_hardening::rules::auditd_session_logins::enforce: false
cis_security_hardening::rules::auditd_setfacl_use::enforce: false
cis_security_hardening::rules::auditd_setfiles::enforce: false
cis_security_hardening::rules::auditd_setsebool::enforce: false
cis_security_hardening::rules::auditd_setxattr_use::enforce: false
cis_security_hardening::rules::auditd_ssh_agent_use::enforce: false
cis_security_hardening::rules::auditd_ssh_keysign_use::enforce: false
cis_security_hardening::rules::auditd_sudo_use::enforce: false
cis_security_hardening::rules::auditd_sudoedit_use::enforce: false
cis_security_hardening::rules::auditd_sudoers::enforce: false
cis_security_hardening::rules::auditd_sudoersd::enforce: false
cis_security_hardening::rules::auditd_system_locale::enforce: false
cis_security_hardening::rules::auditd_time_change::enforce: false
cis_security_hardening::rules::auditd_umount::enforce: false
cis_security_hardening::rules::auditd_unix_checkpwd::enforce: false
cis_security_hardening::rules::auditd_unix_update_use::enforce: false
cis_security_hardening::rules::auditd_user_emulation::enforce: false
cis_security_hardening::rules::auditd_userhelper::enforce: false
cis_security_hardening::rules::auditd_usermod_use::enforce: false

# Need /etc/audisp, created only by auditd_init
cis_security_hardening::rules::auditd_remote::enforce: false
cis_security_hardening::rules::auditd_remote_encrypt::enforce: false
cis_security_hardening::rules::auditd_sending_errors::enforce: false
cis_security_hardening::rules::auditd_when_disk_full::enforce: false

# beaker sets UsePAM no and prepends PermitUserEnvironment yes
cis_security_hardening::rules::sshd_use_pam::enforce: false
cis_security_hardening::rules::sshd_user_environment::enforce: false

# The rest of the sshd rules are enforced, with values that keep beaker's login working
cis_security_hardening::rules::sshd_root_login::permitrootlogin: 'yes'
cis_security_hardening::rules::sshd_max_auth_tries::max_auth_tries: 1000
cis_security_hardening::rules::sshd_timeouts::client_alive_interval: 0
cis_security_hardening::rules::sshd_timeouts::client_alive_count_max: 3

# Verified failing or non-idempotent in containers
cis_security_hardening::rules::tmp_filesystem::enforce: false  # Systemd start for tmp.mount failed
cis_security_hardening::rules::logrotate_configuration::enforce: false  # logrotate pkg installed mid-run, so the fact misses btmp/wtmp until the next run
cis_security_hardening::rules::passwd_min_days::enforce: false  # chage exec re-runs every apply
cis_security_hardening::rules::passwd_inactive_days::enforce: false  # chage exec re-runs every apply
cis_security_hardening::rules::authselect::enforce: false  # re-applies and drags the pam rules with it
cis_security_hardening::rules::disable_wireless::enforce: false  # installs NetworkManager, which takes the container's network down
